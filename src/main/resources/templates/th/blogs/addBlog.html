    <style>
        .btn-update {
            background-color: #ffc107 !important;
            color: #000 !important;
        }

        .btn-update:hover {
            background-color: #f4c947 !important;
            color: #000 !important;
        }

        .btn-delete {

        }

<body class="body-area">
    <!-- Preloader -->
    <div class="preloader" id="preloader">
        <div class="loading">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- Dashboard area -->
    <div class="page__full-wrapper">
        <div th:replace="fragments/common_fragments/sidebar :: sidebar"></div>

        <div class="page__body-wrapper">
            <div th:replace="fragments/common_fragments/header :: header"></div>

            <!-- Header -->
            <div class="body__overlay"></div>

            <!-- Main content -->
            <div class="app__slide-wrapper">
                <div class="breadcrumb__area">
                    <div class="breadcrumb__wrapper mb-25">
                        <nav>
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/admin_dashboard}">Home</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Blogs</li>
                                <li class="breadcrumb-item active" aria-current="page">Add Blog</li>
                            </ol>
                        </nav>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center my-3 mx-1">
                    <div>
                        <h3 class="mb-0">Add Blog</h3>
                    </div>
                </div>
                <div class="row">
                    <div class="col-xxl-12">
                        <form th:action="@{/blogs}" th:object="${blog}" method="post" enctype="multipart/form-data">
                            <div class="row">

                                <!-- Left Side -->
                                <div class="col-lg-8">

                                    <div class="card mb-4">
                                        <div class="card-header">
                                            <h5 class="mb-0">Blog Details</h5>
                                        </div>
                                        <div class="card-body">
                                            <div class="mb-3">
                                                <label class="form-label">Blog Title <span
                                                        class="text-danger">*</span></label>
                                                <input type="text" class="form-control" name="title" id="title"
                                                    placeholder="Enter Blog Title"/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Slug</label>
                                                <input type="text" class="form-control" name="slug" id="slug"
                                                    placeholder="blog-slug" readonly/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Short Description</label>
                                                <textarea class="form-control" rows="4" name="shortDescription"
                                                    placeholder="Short description..."></textarea>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Blog Content</label>
                                                <textarea id="blogContent" name="description"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- SEO -->
                                    <div class="card">
                                        <div class="card-header">
                                            <h5 class="mb-0">SEO Information</h5>
                                        </div>
                                        <div class="card-body">
                                            <div class="mb-3">
                                                <label>Meta Title</label>
                                                <input type="text" class="form-control" name="metaTitle">
                                            </div>
                                            <div class="mb-3">
                                                <label>Meta Keywords</label>
                                                <input type="text" class="form-control" name="metaKeywords">
                                            </div>
                                            <div class="mb-0">
                                                <label>Meta Description</label>
                                                <textarea class="form-control" rows="3"
                                                    name="metaDescription"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Right Side -->
                                <div class="col-lg-4">
                                    <!-- Publish -->
                                    <div class="card mb-4">
                                        <div class="card-header">
                                            <h5 class="mb-0">Publish</h5>
                                        </div>
                                        <div class="card-body">
                                            <div class="mb-3">
                                                <label>Status</label>
                                                <select class="form-select" name="status">
                                                    <option value="DRAFT">Draft</option>
                                                    <option value="PUBLISHED">Published</option>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label>Publish Date</label>
                                                <input type="date" class="form-control" name="publishDate">
                                            </div>
                                            <button class="btn btn-primary w-100">
                                                <i class="fa-solid fa-floppy-disk me-2"></i>
                                                Save Blog
                                            </button>
                                        </div>
                                    </div>
                                    <!-- Category -->
                                    <div class="card mb-4">
                                        <div class="card-header">
                                            <h5 class="mb-0">Category</h5>
                                        </div>
                                        <div class="card-body">
                                            <select class="form-select" name="categoryId">
                                                <option th:each="category : ${categoryList}" th:value="${category.id}"
                                                    th:text="${category.categoryName}">
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <!-- Featured Image -->
                                    <div class="card">
                                        <div class="card-header">
                                            <h5 class="mb-0">Featured Image</h5>
                                        </div>
                                        <div class="card-body">
                                            <input type="file" class="dropify" name="image">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="row">
                    <div class="col-xl-12">
                        <div class="card__footer d-flex justify-content-center">
                            <p>Copyright © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> <span
                                    class="text-black">BZcomposer.</span> All rights reserved</p>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script>
        // Update slug based on title
        const titleInput = document.getElementById("title");
        const slugInput = document.getElementById("slug");

        titleInput.addEventListener("input", function () {
            const slug = this.value
                .toLowerCase()                 // Convert to lowercase
                .trim()                        // Remove extra spaces
                .replace(/\s+/g, "-")          // Replace spaces with -
                .replace(/[^\w-]+/g, "")       // Remove special characters
                .replace(/--+/g, "-");         // Replace multiple - with single -

            slugInput.value = slug;
        });
    </script>

        tinymce.init({
            selector: '#blogContent',
            height: 500,
