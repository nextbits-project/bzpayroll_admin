<!-- Blog Delete Confirmation Modal -->
<div class="modal fade" id="deleteBlogModal" tabindex="-1" aria-labelledby="deleteBlogModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Deletion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this blog? This action cannot be undone.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-blog">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
let deleteBlogId = null;

 document.addEventListener("DOMContentLoaded", function () {
    populateBlogTable();
}); 

async function populateBlogTable() {
    const tableBody = document.getElementById("blog-list-data");
    tableBody.innerHTML = "";

    const response = await fetch(`/api/blog`, {
        method: "GET",
        headers: { "Content-Type": "application/json" },
    });

    if (!response.ok) {
        throw new Error(`Failed to get blog list. Status: ${response.status}`);
    }
    console.log(response);
    
    let data = await response.json();

    console.log(data);
    
    data.forEach(blog => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td class="col px-md-2"><img src="${blog.featuredImage}" style="width:50%;"/></td>
            <td class="col px-md-2">${blog.title}</td>
            <td class="col px-md-2">${blog.category ? blog.category.categoryName : '-'}</td>
            <td class="col px-md-2">${blog.status}</td>
            <td class="col px-md-2">${blog.views}</td>
            <td class="col px-md-2">${blog.publishedAt}</td>
            <td class="col px-md-3 text-center">
                 <a class="btn btn-sm btn-warning" href="/blogs/${blog.id}">Update</a>
                 <button class="btn btn-sm btn-danger" style=" padding: 9px 12px; "  data-id="${blog.id}" data-bs-toggle="modal" data-bs-target="#deleteBlogModal">
                    <i class="fa-regular fa-trash" style=" margin-inline-end: 0px; "></i>
                 </button>
             </td>
        `;
        tableBody.appendChild(row);
    });
}


const deleteModal = document.getElementById("deleteBlogModal");

deleteModal.addEventListener("show.bs.modal", function (event) {
    const button = event.relatedTarget; // Button that opened the modal
    deleteBlogId = button.getAttribute("data-id");
});


// Handle Confirm Delete On Click Event
document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("confirm-delete-blog").addEventListener("click", async function () {
        if (!deleteBlogId) {
            alert("Error: No blog selected for deletion.");
            return;
        }

        try {
            const response = await fetch(`/api/blog/${deleteBlogId}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
            });

            if (!response.ok) {
                throw new Error(`Failed to delete blog. Status: ${response.status}`);
            }

            alert("Blog deleted successfully!");
            populateBlogTable();
            const modalInstance = bootstrap.Modal.getInstance(document.getElementById("deleteBlogModal"));
            if (modalInstance) modalInstance.hide();
            document.body.classList.remove("modal-open");
            document.querySelectorAll(".modal-backdrop").forEach(backdrop => backdrop.remove());

        } catch (error) {
            console.error("Error deleting blog:", error);
            alert("Error deleting blog.");
        }
    });
});
</script>
