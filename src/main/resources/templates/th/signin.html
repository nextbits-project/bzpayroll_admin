<body class="body-area">
<div class="container-xxl">
    <div class="authentication-wrapper basic-authentication">
        <div class="authentication-inner">
            <div class="card__wrapper">
                <div class="authentication-top text-center mb-20">
                    <a href="javascript:" class="logo-black">
                        <img th:src="@{/assets/images/logo/bzcpayrolladmin.png}" alt="logo" style="padding-left:45px;">
                    </a>
                    <p class="mb-15" style="margin-top: 20px">Please sign-in to your account</p>
                </div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <form th:action="@{/admin_login}" method="post">
                    <div class="from__input-box">
                        <div class="form__input-title">
                            <label for="nameEmail">Email or Username</label>
                        </div>
                        <div class="form__input">
                            <input class="form-control" name="name" id="nameEmail" type="text" required>
                        </div>
                    </div>
                    <div class="from__input-box">
                        <div class="form__input-title d-flex justify-content-between">
                            <label for="passwordInput">Password</label>
                            <a href="#"><small>Forgot Password?</small></a>
                        </div>
                        <div class="form__input">
                            <input class="form-control" type="password" name="password" id="passwordInput" required>
                            <div class="pass-icon" id="passwordToggle"><i class="fa-sharp fa-light fa-eye-slash"></i></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me">
                            <label class="form-check-label" for="remember-me">Remember Me</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <button class="btn btn-primary w-100" type="submit">Sign in</button>
                    </div>
                </form>
                <p class="text-center">
                    <span>Need Help?</span>
                    <a href="#"><span>Contact Our Support</span></a>
                </p>
            </div>
        </div>
    </div>
</div>
<div class="progress-wrap">
    <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
        <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98"/>
    </svg>
</div>
