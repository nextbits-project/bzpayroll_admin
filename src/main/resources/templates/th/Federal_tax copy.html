<!doctype html>
<html class="no-js" lang="zxx" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Admin Federal Tax</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-style-mode" content="1">
    <!-- Place favicon.ico in the root directory -->
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.png">

    <!-- CSS here -->
    <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/vendor/animate.css">
    <link rel="stylesheet" href="assets/css/plugins/apexcharts.css">
    <link rel="stylesheet" href="assets/css/plugins/jquery-jvectormap-2.0.5.css">
    <link rel="stylesheet" href="assets/css/plugins/swiper-bundle.min.css">
    <link rel="stylesheet" href="assets/css/vendor/magnific-popup.css">
    <link rel="stylesheet" href="assets/css/vendor/icomoon.css">
    <link rel="stylesheet" href="assets/css/vendor/fontawesome-pro.css">
    <link rel="stylesheet" href="assets/css/vendor/rating.css">
    <link rel="stylesheet" href="assets/css/vendor/dropzone.css">
    <link rel="stylesheet" href="assets/css/plugins/dropify.min.css">
    <link rel="stylesheet" href="assets/css/vendor/spacing.css">
    <link rel="stylesheet" href="assets/css/plugins/datatables.min.css">
    <link rel="stylesheet" href="assets/css/plugins/buttons.bootstrap5.css">
    <link rel="stylesheet" href="assets/css/plugins/jquery.dataTables.min.css">
    <link rel="stylesheet" href="assets/css/plugins/select2.min.css">
    <link rel="stylesheet" href="assets/css/plugins/jquery.timepicker.css">
    <link rel="stylesheet" href="assets/css/plugins/tagify.css">
    <link rel="stylesheet" href="assets/css/plugins/flatpickr.min.css">
    <link rel="stylesheet" href="assets/css/plugins/jquery-ui.css">
    <link rel="stylesheet" href="assets/css/plugins/fullcalendar.min.css">
    <link rel="stylesheet" href="assets/css/plugins/ion.rangeSlider.min.css">
    <link rel="stylesheet" href="assets/css/plugins/simplebar.css">
    <link rel="stylesheet" href="assets/css/plugins/waves.min.css">
    <link rel="stylesheet" href="assets/css/plugins/nano.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="body-area">

<!-- Preloader start -->
<div class="preloader" id="preloader">
    <div class="loading">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>
<!-- Preloader start -->

<div class="page__full-wrapper">
    <div th:replace="fragments/common_fragments/sidebar :: sidebar"></div>

    <div class="page__body-wrapper">
        <div th:replace="fragments/common_fragments/header :: header"></div>

        <div class="body__overlay"></div>

        <div class="app__slide-wrapper">
            <div class="breadcrumb__area">
                <div class="breadcrumb__wrapper mb-25">
                    <nav>
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a th:href="@{/admin_dashboard}">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Users</li>
                        </ol>
                    </nav>
                    <div class="breadcrumb__btn">
                        <a th:href="@{/users/add}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                            <i class="icon-circle-plus"></i>
                            Add User
                        </a>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-xxl-12">
                    <div class="card__wrapper">
                        <div class="card__title-wrap mb-20">
                            <h3 class="card__heading-title">Users List</h3>
                            <div class="d-flex gap-2 mb-3">
                                <a th:href="@{users}" class="btn btn-primary">All</a>
                                <a th:href="@{users(active=true)}" class="btn btn-outline-success">Active</a>
                                <a th:href="@{users(active=false)}" class="btn btn-outline-danger">Inactive</a>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table id="usersTable" class="table table-striped table-hover" style="width:100%">
                                <thead class="bg-light">
                                    <tr>
                                        <th width="12%">First Name</th>
                                        <th width="12%">Last Name</th>
                                        <th width="18%">Email</th>
                                        <th width="12%">Company</th>
                                        <th width="10%">Phone</th>
                                        <th width="16%">Address</th>
                                        <th width="10%">Status</th>
                                        <th width="10%" class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.firstname}">John</td>
                                        <td th:text="${user.lastname}">Doe</td>
                                        <td><a th:href="@{'mailto:' + ${user.emailAddress}}" th:text="${user.emailAddress}" class="text-primary">email@example.com</a></td>
                                        <td th:text="${user.companyName}">Company</td>
                                        <td th:text="${user.phone}">123-456-7890</td>
                                        <td th:text="${user.address1 != null} ? ${user.address1} : 'N/A'">Address</td>
                                        <td>
                                            <span class="badge" th:classappend="${user.active} ? 'bg-success' : 'bg-danger'" th:text="${user.active} ? 'Active' : 'Inactive'">
                                                Status
                                            </span>
                                        </td>
                                        <td class="text-center">
                                            <div class="action__group d-flex align-items-center justify-content-center gap-2">
                                                <a th:href="@{users/view/{id}(id=${user.id})}" class="btn btn-sm btn-icon btn-info" data-bs-toggle="modal" data-bs-target="#viewUserModal" title="View">
                                                    <i class="fa-regular fa-eye"></i>
                                                </a>
                                                <a th:href="@{users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-icon btn-warning" data-bs-toggle="modal" data-bs-target="#editUserModal" title="Edit">
                                                    <i class="fa-sharp fa-light fa-pen"></i>
                                                </a>
                                                <button th:onclick="'deleteUser(' + ${user.id} + ')'" class="btn btn-sm btn-icon btn-danger" title="Delete">
                                                    <i class="fa-regular fa-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- footer area start -->
        <footer class="footer">
            <div class="row">
                <div class="col-xl-12">
                    <div class="card__footer d-flex justify-content-center">
                        <p>Copyright © <span id="year">2024</span> <span class="text-black">BZcomposer.</span> All rights reserved</p>
                    </div>
                </div>
            </div>
        </footer>
        <!-- footer area end -->
    </div>
</div>

<!-- add new user modal -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="addUserModalLabel">Add New User</h5>
                <button type="button" class="bd-btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="fa-solid fa-xmark-large"></i>
                </button>
            </div>
            <div class="modal-body">
                <form th:action="@{/users/save}" method="post" id="addUserForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="firstname" class="form-label">First Name <span class="text-danger">*</span></label>
                                <input class="form-control" name="firstname" id="firstname" type="text" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="lastname" class="form-label">Last Name</label>
                                <input class="form-control" name="lastname" id="lastname" type="text">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                <input class="form-control" name="email" id="email" type="email" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="phone" class="form-label">Phone</label>
                                <input class="form-control" name="phone" id="phone" type="text">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                                <input class="form-control" name="password" id="password" type="password" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                                <input class="form-control" name="confirmPassword" id="confirmPassword" type="password" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="statusAdd" class="form-label">Status <span class="text-danger">*</span></label>
                                <select class="form-select" name="status" id="statusAdd" required>
                                    <option value="true">Active</option>
                                    <option value="false">Inactive</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" name="address" id="address" rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top pt-3">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JS here -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/plugins/datatables.min.js"></script>
<script src="assets/js/plugins/select2.full.min.js"></script>
<script src="assets/js/plugins/sweetalert2.all.min.js"></script>
<script src="assets/js/main.js"></script>

<!-- edit user modal -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                <button type="button" class="bd-btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="fa-solid fa-xmark-large"></i>
                </button>
            </div>
            <div class="modal-body" id="editUserModalContent">
                <!-- Content will be loaded dynamically -->
            </div>
        </div>
    </div>
</div>

<!-- view user modal -->
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-light">
                                <button type="button" class="bd-btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="fa-solid fa-xmark-large"></i>
                </button>
            </div>
            <div class="modal-body" id="viewUserModalContent">
                <!-- Content will be loaded dynamically -->
            </div>
            
        </div>
    </div>



<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Initialize DataTable with consistent settings
        $('#usersTable').DataTable({
            responsive: true,
            dom: '<"top"<"row align-items-center"<"col-md-6"l><"col-md-6"f>>>rt<"bottom"<"row align-items-center"<"col-md-6"i><"col-md-6"p>>>',
            language: {
                search: "",
                searchPlaceholder: "Search users...",
                lengthMenu: "Show _MENU_ entries",
                info: "Showing _START_ to _END_ of _TOTAL_ entries",
                paginate: {
                    previous: '<i class="fa fa-angle-left"></i>',
                    next: '<i class="fa fa-angle-right"></i>'
                }
            },
            initComplete: function() {
                $('.dataTables_filter input').addClass('form-control');
                $('.dataTables_length select').addClass('form-select');
            }
        });

        // Initialize Select2 for status dropdown
        $('#statusAdd').select2({
            minimumResultsForSearch: Infinity,
            dropdownParent: $('#addUserModal'),
            width: '100%'
        });

        // Handle edit modal opening
        $(document).on('click', '[data-bs-target="#editUserModal"]', function(e) {
            e.preventDefault();
            const url = $(this).attr('href');
            
            $.get(url, function(data) {
                $('#editUserModalContent').html(data);
                $('#editUserModal').modal('show');
                
                // Initialize Select2 for status dropdown in edit modal
                $('#status').select2({
                    minimumResultsForSearch: Infinity,
                    dropdownParent: $('#editUserModal'),
                    width: '100%'
                });
            }).fail(function() {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Failed to load user data',
                    confirmButtonText: 'OK'
                });
            });
        });

        // Handle view modal opening
        $(document).on('click', '[data-bs-target="#viewUserModal"]', function(e) {
            e.preventDefault();
            const url = $(this).attr('href');
            
            $.get(url, function(data) {
                $('#viewUserModalContent').html(data);
              
            }).fail(function() {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Failed to load user details',
                    confirmButtonText: 'OK'
                });
            });
        });

        // Consistent delete user function
        window.deleteUser = function (userId) {
            Swal.fire({
                title: 'Delete User?',
                text: "Are you sure you want to delete this user? This action cannot be undone.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Delete',
                cancelButtonText: 'Cancel',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: '/users/delete/' + userId,
                        method: 'POST',
                        success: function(data) {
                            if (data.success) {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Deleted!',
                                    text: 'User has been deleted successfully.',
                                    confirmButtonText: 'OK'
                                }).then(() => {
                                    window.location.reload();
                                });
                            } else {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Error',
                                    text: data.message || 'Failed to delete user',
                                    confirmButtonText: 'OK'
                                });
                            }
                        },
                        error: function(xhr) {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error',
                                text: 'Failed to delete user: ' + (xhr.responseJSON?.message || 'Server error'),
                                confirmButtonText: 'OK'
                            });
                        }
                    });
                }
            });
        };
    });
</script>

</body>
</html>
