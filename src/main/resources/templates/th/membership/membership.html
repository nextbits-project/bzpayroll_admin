<!doctype html>
<html class="no-js" lang="zxx">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>BZcomposer Membership</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<body class="body-area">

    <!-- Preloader start -->
    <div class="preloader" id="preloader">
        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="page__full-wrapper">
        <div th:replace="fragments/common_fragments/sidebar :: sidebar"></div>

        <div class="page__body-wrapper">
            <div th:replace="fragments/common_fragments/header :: header"></div> <!-- Preloader start -->

            <div class="body__overlay"></div>
            <!-- App header area end -->

            <!-- App side area start -->
            <div class="app__slide-wrapper">
                <div class="breadcrumb__area">
                    <div class="breadcrumb__wrapper mb-25">
                        <nav>
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a href="Admin_dashboard.html">Home</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Menbership Plans</li>
                            </ol>
                        </nav>
                    </div>
                </div>
                <div class="row">


                    <div class="col-xxl-12">
                        <div class="card__wrapper">
                            <div class="card__title-wrap mb-20">
                                <h3 class="card__heading-title">Menbership Plans</h3>
                                <button type="submit" style="float:right;" class="btn btn-success rounded-0" 
                                data-bs-toggle="modal" data-bs-target="#addMembershipPlan">
                                    <i class="icon-circle-plus"></i>Add New Menbership</button><br>

                            </div>
                            <table id="complexHeaders" class="table table-striped mb-15">
                                <thead>
                                    <tr>
                                        <th>Sr NO</th>
                                        <th>Membership Plan Name</th>
                                        <th>Price/Month</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="plan, stat : ${membershipPlanList}">
                                        <td th:text="${stat.count}"></td>
                                        <td>
                                            <span th:text="${plan.planName}"></span><br>
                                            <span th:text="${plan.description}"></span>
                                        </td>
                                        <td>
                                            <span th:text="'$' + ${plan.amount} + ' / ' + ${plan.billingInterval}"></span>
                                        </td>
                                        <td>
                                            <div class="d-flex align-items-center justify-content-start gap-10">
                                                <button class="table__icon edit"
                                                        data-bs-toggle="modal"
                                                        data-bs-target="#editMembershipPlan"
                                                        th:attr="onclick=|updatePlan('${plan.id}', '${plan.planName}', '${plan.amount}', '${plan.billingInterval}', '${plan.employeeLimit}', '${plan.description}')|">
                                                    <i class="fa-sharp fa-light fa-pen"></i>
                                                </button>
                                                <button class="table__icon delete" 
                                                data-bs-toggle="modal"
                                                        data-bs-target="#deletePlanModal"
                                                        th:attr="onclick=|deletePlan('${plan.id}')|">
                                                    <i class="fa-regular fa-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </div>
            <!-- App side area end -->

            <!-- footer area start -->
            <footer class="footer">
                <div class="row">
                    <div class="col-xl-12">
                        <div class="card__footer d-flex justify-content-center">
                            <p>Copyright © <span id="year">2024</span> <span class="text-black">BZcomposer.</span> All
                                rights reserved
                            </p>
                        </div>
                    </div>
                </div>
            </footer>
            <!-- footer area end -->

        </div>
    </div>
    <!-- Dashboard area end -->

    <!-- add new plan modal -->
    <div class="modal fade" id="addMembershipPlan" tabindex="-1" aria-labelledby="addMembershipPlanLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addMembershipPlanLabel">Add Membership Plan</h5>
                    <button type="button" class="bd-btn-close" data-bs-dismiss="modal" aria-label="Close"><i
                            class="fa-solid fa-xmark-large"></i></button>
                </div>
                <div class="modal-body">
                    <form action="/membership" method="post">
                        <div class="card__wrapper mb-20">
                            <div class="row g-20 gy-20 align-items-center justify-content-center">
                                <div class="col-lg-6">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="planName">Plan Name <span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <input class="form-control" name="planName" id="planName" type="text" required/>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="amount">Amount<span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <input class="form-control" name="amount" id="planAmount" type="number" required/>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="billingInterval">billing Interval <span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <select class="form-select" name="billingInterval" id="billingInterval" required>
                                                <option value="MONTHLY">MONTHLY</option>
                                                <option value="YEARLY">YEARLY</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="employeeLimit">Employee Limit<span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <input class="form-control" name="employeeLimit" 
                                            id="employeeLimit" type="text" placeholder="10,100,1000" required/>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    
                                </div>
                                
                                <div class="col-lg-12 text-center">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="description">Description <span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <textarea class="form-control" name="description" id="description" required></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="submit__btn text-center">
                            <button class="btn btn-primary" type="submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- add new plan modal -->

    <!-- edit plan modal -->
    <div class="modal fade" id="editMembershipPlan" tabindex="-1" aria-labelledby="editMembershipPlanLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editMembershipPlanLabel">Add Membership Plan</h5>
                    <button type="button" class="bd-btn-close" data-bs-dismiss="modal" aria-label="Close"><i
                            class="fa-solid fa-xmark-large"></i></button>
                </div>
                <div class="modal-body">
                    <form action="/membership/update" method="post">
                        <input type="hidden" id="editID" name="id"/>
                        <div class="card__wrapper mb-20">
                            <div class="row g-20 gy-20 align-items-center justify-content-center">
                                <div class="col-lg-6">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="planName">Plan Name <span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <input class="form-control" name="planName" id="editPlanName" type="text" required/>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="amount">Amount<span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <input class="form-control" name="amount" id="editPlanAmount" type="number" required/>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="billingInterval">billing Interval <span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <select class="form-select" name="billingInterval" id="editBillingInterval" required>
                                                <option value="MONTHLY">MONTHLY</option>
                                                <option value="YEARLY">YEARLY</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="employeeLimit">Employee Limit<span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <input class="form-control" name="employeeLimit" 
                                            id="editEmployeeLimit" type="text" placeholder="10,100,1000" required/>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    
                                </div>
                                
                                <div class="col-lg-12 text-center">
                                    <div class="from__input-box">
                                        <div class="form__input-title">
                                            <label for="description">Description <span>*</span></label>
                                        </div>
                                        <div class="form__input">
                                            <textarea class="form-control" name="description" id="editDescription" required></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="submit__btn text-center">
                            <button class="btn btn-primary" type="submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- edit plan modal -->

    <!-- plan Delete Confirmation Modal -->
    <div class="modal fade" id="deletePlanModal" tabindex="-1" aria-labelledby="deletePlanModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form action="/membership/delete" method="post">
                <input type="hidden" id="deleteID" name="id"/>
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirm Deletion</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete this plan? This action cannot be undone.
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger" id="confirm-delete-blog">Delete</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script>
        function updatePlan(id, editPlanName, editPlanAmount, editBillingInterval, editEmployeeLimit, editDescription){
            debugger;
            document.getElementById("editID").value = id;
            document.getElementById("editPlanName").value = editPlanName;
            document.getElementById("editPlanAmount").value = editPlanAmount;
            document.getElementById("editBillingInterval").value = editBillingInterval;
            document.getElementById("editEmployeeLimit").value = editEmployeeLimit;
            document.getElementById("editDescription").value = editDescription;
        }
        function deletePlan(id){
            document.getElementById("deleteID").value = id;
        }
    </script>
