<!-- Category Delete Confirmation Modal -->
<div class="modal fade" id="deleteCategoryModal" tabindex="-1" aria-labelledby="deleteCategoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Deletion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this category? This action cannot be undone.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-category">Delete</button>
            </div>
        </div>
    </div>
</div>
<script>
let deleteCategoryId = null;
// Update slug based on category name
const categoryInput = document.getElementById("categoryName");
const slugInput = document.getElementById("slug");

categoryInput.addEventListener("input", function () {
    const slug = this.value
        .toLowerCase()                 // Convert to lowercase
        .trim()                        // Remove extra spaces
        .replace(/\s+/g, "-")          // Replace spaces with -
        .replace(/[^\w-]+/g, "")       // Remove special characters
        .replace(/--+/g, "-");         // Replace multiple - with single -

    slugInput.value = slug;
});

// Update slug based on category name
const uCategoryInput = document.getElementById("uCategoryName");
const uSlugInput = document.getElementById("uSlug");

uCategoryInput.addEventListener("input", function () {
    const slug = this.value
        .toLowerCase()                 // Convert to lowercase
        .trim()                        // Remove extra spaces
        .replace(/\s+/g, "-")          // Replace spaces with -
        .replace(/[^\w-]+/g, "")       // Remove special characters
        .replace(/--+/g, "-");         // Replace multiple - with single -

    uSlugInput.value = slug;
});


const deleteModal = document.getElementById("deleteCategoryModal");

deleteModal.addEventListener("show.bs.modal", function (event) {
    const button = event.relatedTarget; // Button that opened the modal
    deleteCategoryId = button.getAttribute("data-id");

    console.log("deleteCategoryId"+deleteCategoryId);
});

// Handle Confirm Delete On Click Event
document.addEventListener("DOMContentLoaded", function () {
    populateCategoryTable();
    document.getElementById("confirm-delete-category").addEventListener("click", async function () {
        if (!deleteCategoryId) {
            alert("Error: No category selected for deletion.");
            return;
        }

        try {
            const response = await fetch(`/api/category/${deleteCategoryId}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
            });

            if (!response.ok) {
                throw new Error(`Failed to delete category. Status: ${response.status}`);
            }

            alert("Category deleted successfully!");
            populateCategoryTable();
            const modalInstance = bootstrap.Modal.getInstance(document.getElementById("deleteCategoryModal"));
            if (modalInstance) modalInstance.hide();
            document.body.classList.remove("modal-open");
            document.querySelectorAll(".modal-backdrop").forEach(backdrop => backdrop.remove());

        } catch (error) {
            console.error("Error deleting category:", error);
            alert("Error deleting category.");
        }
    });
});

async function populateCategoryTable() {
    const tableBody = document.getElementById("category-list-data");
    tableBody.innerHTML = "";

    const response = await fetch(`/api/category`, {
        method: "GET",
        headers: { "Content-Type": "application/json" },
    });

    if (!response.ok) {
        throw new Error(`Failed to get category list. Status: ${response.status}`);
    }
    let data = await response.json();

    console.log(data);
    
    data.forEach(category => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td class="col px-md-2">${category.id}</td>
            <td class="col px-md-2">${category.categoryName}</td>
            <td class="col px-md-3 text-center">
                 <button class="btn btn-sm btn-warning" data-id="${category.id}" onclick="updateCategory(${category.id},'${category.categoryName}', '${category.slug}')" data-bs-toggle="modal" data-bs-target="#updateCategoryModal">Update</button>
                 <button class="btn btn-sm btn-danger" style=" padding: 9px 12px; "  data-id="${category.id}" data-bs-toggle="modal" data-bs-target="#deleteCategoryModal">
                    <i class="fa-regular fa-trash" style=" margin-inline-end: 0px; "></i>
                 </button>
             </td>
        `;
        tableBody.appendChild(row);
    });
}

function updateCategory(id, categoryName, slug){
    document.getElementById("category-id").value = id;
    document.getElementById("uCategoryName").value = categoryName;
    document.getElementById("uSlug").value = slug;
}
</script>
