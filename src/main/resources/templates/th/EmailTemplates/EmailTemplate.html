    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".list-group").forEach((listGroup) => {
          listGroup.addEventListener("click", async (ev) => {
            const a = ev.target.closest(".template-item");
            if (!a || !listGroup.contains(a)) return;
            ev.preventDefault();

            // Highlight selected
            listGroup
              .querySelectorAll(".template-item")
              .forEach((el) => el.classList.remove("active"));
            a.classList.add("active");
          });
        });

    const firstCategory = document.querySelector(".nav-item .nav-link");
    if (firstCategory) {
        firstCategory.classList.add("active"); // UI highlight
        onCategoryClick(firstCategory);        // ✅ triggers fetch + first template select
    }

      });
    </script>
    <script th:inline="javascript">
      /**
       * Fetch templates for a category and populate the sidebar
       */
      /*<![CDATA[*/
      function onCategoryClick(element) {
          const categoryCode = element.dataset.code;
          const categoryId = element.dataset.id;
          document.getElementById("categoryId").value = categoryId;
          console.log("Clicked category code:", categoryCode);

          fetch(`/email-templates/category/${categoryCode}/templates`)
              .then(res => res.json())
              .then(data => {
                  populateSidebar(data);
                  selectFirstTemplate(data);  // ✅ auto-select first template
              })
              .catch(err => console.error("Fetch error:", err));
      }

      /**
       * Populate the sidebar with template titles
       */
      

      function populateSidebar(templates) {
          const sidebar = document.getElementById("templateSidebar");
          sidebar.innerHTML = ""; // Clear previous

          templates.forEach((template, index) => {
              const a = document.createElement("a");
              a.href = "#";
              a.className = "list-group-item list-group-item-action template-item bg-light";
              a.textContent = template.title;
              
              a.dataset.id = template.id;
              a.dataset.title = template.title;
              a.dataset.subject = template.subject;
              a.dataset.body = template.body;

              // Highlight first one by default
              if (index === 0) {
                  a.classList.add("active");
              }

              a.addEventListener("click", (e) => {
                  e.preventDefault();
                  document.getElementById("btnSave").style.display = "none";
                  document.getElementById("btnUpdate").style.display = "block";
                  // Remove active from all
                  sidebar.querySelectorAll("a").forEach(link => link.classList.remove("active"));
                  a.classList.add("active");

                  populateTemplatePanel(template);
              });

              sidebar.appendChild(a);
          });
      }



      /**
      * Auto-select the first template
      */
      function selectFirstTemplate(templates) {
          if (templates && templates.length > 0) {
              populateTemplatePanel(templates[0]);
          }
      }
      /**

       * Optional: New, Save, Delete buttons
       */
      document.getElementById("btnNew").addEventListener("click", () => {
        document.getElementById("templateId").value = "";
        document.getElementById("templateName").value = "";
        document.getElementById("recipientName").value = "";
        document.getElementById("templateSubject").value = "";
        document.getElementById("templateBody").innerHTML = "";
        document.getElementById("btnSave").style.display = "block";
        document.getElementById("btnUpdate").style.display = "none";
        document.getElementById("btnDelete").style.display = "none";
      });

      document.getElementById("btnSave").addEventListener("click", () => {
        const data = {
            categoryId: $("#categoryId").val(),
            templateName: $("#templateName").val(),
            recipientName: $("#recipientName").val(),
            subject: $("#templateSubject").val(),
            body: $("#templateBody").html()
        };
        $.ajax({
            url: "/email-templates/category/template/add",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(data),

            success: function (response) {
              Swal.fire({
                  icon: "success",
                  title: "Success",
                  text: response.message,
                  confirmButtonText: "OK"
              }).then(() => {
                  window.location.reload();
              });
            },

            error: function (xhr, status, error) {
              let message = "Failed to delete template.";
              if (xhr.responseJSON && xhr.responseJSON.message) {
                  message = xhr.responseJSON.message;
              }
              Swal.fire({
                  icon: "error",
                  title: "Error",
                  text: message,
                  confirmButtonText: "OK"
              });
            }
        });
      });

      document.getElementById("btnUpdate").addEventListener("click", () => {
        const data = {
            id: $("#templateId").val(),
            templateName: $("#templateName").val(),
            recipientName: $("#recipientName").val(),
            subject: $("#templateSubject").val(),
            body: $("#templateBody").html()
        };
        $.ajax({
            url: "/email-templates/category/template/update",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(data),

            success: function (response) {
              Swal.fire({
                  icon: "success",
                  title: "Success",
                  text: response.message,
                  confirmButtonText: "OK"
              }).then(() => {
                  window.location.reload();
              });
            },

            error: function (xhr, status, error) {
              let message = "Failed to delete template.";
              if (xhr.responseJSON && xhr.responseJSON.message) {
                  message = xhr.responseJSON.message;
              }
              Swal.fire({
                  icon: "error",
                  title: "Error",
                  text: message,
                  confirmButtonText: "OK"
              });
            }
        });
      });
      document.getElementById("btnDelete").addEventListener("click", () => {
          const deleteModal = new bootstrap.Modal(document.getElementById("deleteConfirmModal"));
          deleteModal.show();
      });
      document.getElementById("confirmDelete").addEventListener("click", () => {
          const data = {
              id: $("#templateId").val()
          };

          $.ajax({
              url: "/email-templates/category/template/delete",
              type: "POST",
              contentType: "application/json",
              data: JSON.stringify(data),

              success: function(response) {
                // Close the delete confirmation modal
                const modal = bootstrap.Modal.getInstance(document.getElementById("deleteConfirmModal"));
                if (modal) {
                    modal.hide();
                }
                Swal.fire({
                    icon: "success",
                    title: "Success",
                    text: response.message,
                    confirmButtonText: "OK"
                }).then(() => {
                    window.location.reload();
                });
              },

              error: function(xhr, status, error) {
                let message = "Failed to delete template.";
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    message = xhr.responseJSON.message;
                }
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: message,
                    confirmButtonText: "OK"
                });
              }
          });
      });
    </script>

    <script th:inline="javascript">
      /*<![CDATA[*/
      function populateTemplatePanel(template) {
        const id = document.getElementById("templateId");
        const templateName = document.getElementById("templateName");
        const nameInput = document.getElementById("recipientName");
        const subjectInput = document.getElementById("templateSubject");
        const bodyDiv = document.getElementById("templateBody");
        const placeholdersContainer = document.getElementById(
          "placeholdersContainer",
        );
        
        console.log("[DEBUG] templates :: " , template );

        // Reset
        nameInput.value = "";
        nameInput.placeholder = "Enter Reciepient Mail";
        subjectInput.value = template.subject;
        bodyDiv.innerHTML = template.body;
        templateName.value = template.title;
        id.value = template.id;
        placeholdersContainer.innerHTML = "";

        // Use a string for regex to avoid Thymeleaf parsing issues
        const regex = new RegExp("\\[([^\\]]+)\\]", "g"); // double backslash!

        // Use Array.from instead of spread to avoid issues
        const matches = Array.from(template.body.matchAll(regex));

        matches.forEach((match) => {
          const placeholder = match[1];

          const wrapper = document.createElement("div");
          wrapper.className = "mb-2";

          const label = document.createElement("label");
          label.className = "form-label";
          label.textContent = placeholder;

          const input = document.createElement("input");
          input.type = "text";
          input.className = "form-control";
          input.placeholder = placeholder;

          input.addEventListener("input", () => {
            bodyDiv.innerHTML = template.body.replace(
              new RegExp(`\\[${placeholder}\\]`, "g"),
              input.value || `[${placeholder}]`,
            );
          });

          wrapper.appendChild(label);
          wrapper.appendChild(input);
          placeholdersContainer.appendChild(wrapper);
        });
      }
      /*]]>*/
    </script>
