<div th:fragment="editModal" class="modal fade" id="editCustomer" tabindex="-1" aria-labelledby="editCustomerLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editCustomerLabel">Edit Customer</h5>
                <button type="button" class="bd-btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="fa-solid fa-xmark-large"></i>
                </button>
            </div>
            <div class="modal-body">
                <form th:action="@{/customers/update}" th:object="${customer}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="card__wrapper mb-20">
                        <div class="row g-20 gy-20 align-items-center justify-content-center">
                            <div class="col-lg-6">
                                <div class="from__input-box">
                                    <div class="form__input-title">
                                        <label for="editFirstName">First Name <span>*</span></label>
                                    </div>
                                    <div class="form__input">
                                        <input class="form-control" id="editFirstName" type="text" th:field="*{firstName}" required>
                                        <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="from__input-box">
                                    <div class="form__input-title">
                                        <label for="editLastName">Last Name <span>*</span></label>
                                    </div>
                                    <div class="form__input">
                                        <input class="form-control" id="editLastName" type="text" th:field="*{lastName}" required>
                                        <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="from__input-box">
                                    <div class="form__input-title">
                                        <label for="editEmail">Email <span>*</span></label>
                                    </div>
                                    <div class="form__input">
                                        <input class="form-control" id="editEmail" type="email" th:field="*{email}" required>
                                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="from__input-box">
                                    <div class="form__input-title">
                                        <label for="editPhone">Phone <span>*</span></label>
                                    </div>
                                    <div class="form__input">
                                        <input class="form-control" id="editPhone" type="tel" th:field="*{phone}" required>
                                        <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-12">
                                <div class="from__input-box">
                                    <div class="form__input-title">
                                        <label for="editAddress">Address <span>*</span></label>
                                    </div>
                                    <div class="form__input">
                                        <input class="form-control" id="editAddress" type="text" th:field="*{address}" required>
                                        <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="from__input-box">
                                    <div class="form__input-title">
                                        <label for="editMembership">Membership <span>*</span></label>
                                    </div>
                                    <div class="form__input">
                                        <select class="form-select" id="editMembership" th:field="*{membership}" required>
                                            <option value="STANDARD">Standard</option>
                                            <option value="STANDARD_PLUS">Standard Plus</option>
                                            <option value="SILVER">Silver</option>
                                            <option value="SILVER_PLUS">Silver Plus</option>
                                            <option value="GOLD">Gold</option>
                                            <option value="GOLD_PLUS">Gold Plus</option>
                                        </select>
                                        <span th:if="${#fields.hasErrors('membership')}" th:errors="*{membership}" class="text-danger"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="from__input-box">
                                    <div class="form__input-title">
                                        <label for="editBusinessType">Business Type <span>*</span></label>
                                    </div>
                                    <div class="form__input">
                                        <select class="form-select" id="editBusinessType" th:field="*{businessType}" required>
                                            <option value="CONTRACTOR">Contractor</option>
                                            <option value="E_SALES">E-Sales</option>
                                            <option value="NONPROFIT">Nonprofit</option>
                                            <option value="RETAIL">Retail</option>
                                            <option value="SERVICE">Service</option>
                                            <option value="WHOLESALE">Wholesale</option>
                                        </select>
                                        <span th:if="${#fields.hasErrors('businessType')}" th:errors="*{businessType}" class="text-danger"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="from__input-box">
                                    <div class="form__input-title">
                                        <label for="editActive">Status</label>
                                    </div>
                                    <div class="form__input">
                                        <select class="form-select" id="editActive" th:field="*{active}">
                                            <option value="true">Active</option>
                                            <option value="false">Inactive</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="submit__btn text-center">
                        <button class="btn btn-primary" type="submit">Update Customer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
