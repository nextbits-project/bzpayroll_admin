spring.application.name=payroll
app.demo.seed-sample-tax-data=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

DriverClass=com.mysql.jdbc.Driver
URL=jdbc:mysql://localhost:3307/bzpayroll
UID=root
password=CC0Df1CD

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/bzpayroll
spring.datasource.username=root
spring.datasource.password=CC0Df1CD
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Use custom naming strategy to preserve exact column names (prevents camelCase -> snake_case conversion)
spring.jpa.hibernate.naming.physical-strategy=com.payroll.config.ExactColumnNamingStrategy
logging.level.org.springframework.web=WARN

# none = don't touch DB schema (safest for production/existing DBs)
# validate = check schema matches entities but don't modify
# update = modify schema (can cause FK constraint crashes - avoid)
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.tool.schema=WARN

spring.messages.basename=messages, config.i18n.messages
spring.messages.common-messages=classpath:messages.properties
spring.messages.fallback-to-system-locale=false
arizona.standard.tax.rate = 2.0

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Tomcat multipart configuration - increase file count limit
# Note: maxParts is configured in MultipartConfig.java via connector customization
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-http-post-size=50MB
server.tomcat.max-parameter-count=10000
# Try setting maxParts if Spring Boot supports it (may not be available in all versions)
# server.tomcat.max-parts=1000

file.upload-dir=/Library/bzcomposer-images/
#file.upload-dir=/home/admin/public_html/bzcomposer-images/
image.base-url=http://localhost:8080/api/images/
#image.base-url=https://bzpayroll.com/api/images/