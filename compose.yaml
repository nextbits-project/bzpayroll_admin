
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_3307
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: operatoroverloading
      MYSQL_DATABASE: bzpayroll
      MYSQL_USER: bzpayroll
      MYSQL_PASSWORD: operatoroverloading
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

